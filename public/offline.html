<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem ligação — assista-me</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; }
    .card { text-align: center; padding: 2rem; max-width: 320px; }
    .icon { font-size: 3rem; margin-bottom: 1rem; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .5rem; }
    p { font-size: .9rem; color: #64748b; margin: 0 0 1.5rem; }
    button { background: #0f172a; color: #fff; border: none; border-radius: 8px; padding: .6rem 1.5rem; cursor: pointer; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>Sem ligação à internet</h1>
    <p>Verifica a tua ligação e tenta novamente.</p>
    <button onclick="window.location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
